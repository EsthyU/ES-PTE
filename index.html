<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ES-PTE">
<meta name="theme-color" content="#eef1f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101826" media="(prefers-color-scheme: dark)">
<meta name="description" content="PTE Core trainer: every task type, eight full mocks, timed practice with scoring.">
<title>ES-PTE</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#101826; --bg-2:#16202f; --card:#18202f; --card-2:#1f2a3b; --line:#26324a; --line-2:#3a4864;
  --ink:#eef1f6; --ink-2:#b6c0d0; --ink-3:#8492a8;
  --brass:#d4a747; --brass-soft:#2c2718; --sage:#4fae94; --sage-soft:#13302a; --slate:#7ea3d1; --slate-soft:#17283c;
  --clay:#e08a6f; --clay-soft:#32211b; --plum:#b08cc4; --plum-soft:#291f33;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.35);
  --shadow-lg:0 16px 44px rgba(0,0,0,.5);
}
:root[data-theme="light"]{
  color-scheme: light;
  --bg:#eef1f7; --bg-2:#e4eaf3; --card:#ffffff; --card-2:#f2f5fa; --line:#dde3ed; --line-2:#c3ccdb;
  --ink:#101826; --ink-2:#4a5567; --ink-3:#7a8699;
  --brass:#8a6614; --brass-soft:#f6ecd4; --sage:#15715c; --sage-soft:#dff0ea; --slate:#2f4d7a; --slate-soft:#e3ebf6;
  --clay:#97452c; --clay-soft:#f8e4dd; --plum:#6a3f7c; --plum-soft:#f0e5f4;
  --shadow:0 1px 2px rgba(16,24,38,.06),0 10px 26px rgba(16,24,38,.08);
  --shadow-lg:0 16px 44px rgba(16,24,38,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600;letter-spacing:-.2px}
.muted{color:var(--ink-3)}
.small{font-size:12px;font-weight:500}
.good{color:var(--sage)} .warn{color:var(--brass)} .bad{color:var(--clay)}

#app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 104px)}
body.in-run #app{padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 2px 16px}
.topbar .sub{color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase}
.topbar h1{margin:2px 0 0;font-size:28px;line-height:1.05}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-title{display:flex;align-items:center;gap:10px;font-size:16px;margin:0}
.card-title small{display:block;font-family:Inter;font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:0;line-height:1.35}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.hero{border-radius:24px;padding:20px;background:linear-gradient(155deg,color-mix(in srgb,var(--brass) 12%,var(--bg-2)),var(--card));border:1px solid var(--line);box-shadow:var(--shadow)}
.hero h2{margin:8px 0 4px;font-size:26px;line-height:1.15}
.herorow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.herorow div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}
.herorow small{display:block;font-size:10px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3)}
.herorow b{font-size:17px;font-family:Fraunces,Georgia,serif}

.row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .name{flex:1;min-width:0;font-weight:600}
.row .name small,.listrow .name small{display:block;font-size:11px;color:var(--ink-3);font-weight:600}
.listrow .name{font-weight:700}
.barline{width:88px;height:7px;border-radius:99px;background:var(--card-2);overflow:hidden;flex:none;border:1px solid var(--line)}
.barline i{display:block;height:100%;border-radius:99px}
.listrow{display:flex;width:100%;align-items:center;gap:10px;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.listrow:last-of-type{border-bottom:0}
.listrow .go{color:var(--ink-3);font-size:20px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;background:var(--ink);color:var(--bg);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card-2);color:var(--ink);border:1px solid var(--line)}
.btn.quiet{background:transparent;color:var(--ink-2);border:1px solid var(--line)}
.btn.danger{background:var(--clay-soft);color:var(--clay)}
.btn.block{width:100%}
.btn.sm{padding:9px 13px;font-size:13px;border-radius:11px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:inline-grid;place-items:center;color:var(--ink-2);flex:none;font-size:15px}
.icon-btn:disabled{opacity:.35}
.badge{display:inline-flex;align-items:center;border-radius:8px;padding:4px 8px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;background:var(--card-2);color:var(--ink-3);border:1px solid var(--line)}
.badge.good{background:var(--sage-soft);color:var(--sage);border-color:transparent}
.badge.warn{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.badge.bad{background:var(--clay-soft);color:var(--clay);border-color:transparent}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:2px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:transparent;padding:9px 4px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--ink-3)}
.seg button.on{background:var(--ink);color:var(--bg)}
.field{background:var(--card-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;font-weight:500;outline:none;width:100%;font-family:inherit}
.field:focus{border-color:var(--ink-2)}
.field.sm{padding:8px 10px;font-weight:600}
.field.big{font-size:20px;font-weight:700;padding:14px;text-align:center}
.field.answer{line-height:1.55;font-weight:400}
.field.notes{background:transparent;border-style:dashed;margin:8px 0}
select.field{appearance:none;-webkit-appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 9px) 50%;background-size:5px 5px;background-repeat:no-repeat}
.switch{width:50px;height:30px;border-radius:999px;background:var(--line-2);border:0;position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--sage)} .switch.on::after{transform:translateX(20px)}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-weight:500;font-size:14px}
.steps li{margin:6px 0}
.rubric{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;font-weight:500}
.rubric li{margin:3px 0}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px;margin-top:8px}
.spark .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.spark .b{width:100%;max-width:26px;border-radius:4px 4px 0 0;min-height:3px}
.spark .l{font-size:10px;font-weight:700;color:var(--ink-3)}

/* ---------- runner ---------- */
.runner{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.runbar{display:flex;align-items:center;gap:12px;padding:4px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:0;background:var(--bg);z-index:5}
.runtitle{flex:1;min-width:0}
.runtitle b{display:block;font-size:15px}
.runtitle small{color:var(--ink-3);font-size:11px;font-weight:600}
.clockwrap{text-align:right;flex:none;width:74px}
.clockwrap #clock{font-weight:800;font-size:16px}
.clockbar{height:4px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.clockbar i{display:block;height:100%;background:var(--brass);width:100%;transition:width .2s linear}
.runbody{flex:1}
.runfoot{position:sticky;bottom:0;display:flex;gap:8px;padding:12px 0 calc(env(safe-area-inset-bottom) + 12px);background:linear-gradient(to top,var(--bg) 70%,transparent)}
.runfoot .btn{flex:1}
.introcard{text-align:center;padding:24px 6px}
.introcard h3{margin:12px 0 4px;font-size:22px}
.specs{list-style:none;margin:14px auto 18px;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.specs li{background:var(--card-2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;color:var(--ink-2)}
.prompt{font-size:19px;line-height:1.65;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.prompt.serif{font-family:Fraunces,Georgia,serif;font-size:20px}
.passage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;line-height:1.75;box-shadow:var(--shadow)}
.passage.cloze{line-height:2.4}
.qline{font-weight:700;margin:16px 2px 10px;font-size:15px}
.audio-note{background:var(--slate-soft);color:var(--slate);border-radius:14px;padding:12px 14px;font-weight:700;font-size:13px;text-align:center;margin-bottom:12px}
.chart-wrap{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);text-align:center}
.chart-title{font-weight:700;font-size:13px;margin-bottom:10px}
.inline-sel{background:var(--card-2);border:1px solid var(--line-2);border-radius:8px;padding:4px 6px;font-size:14px;font-weight:700;max-width:150px}
.inline-in{background:var(--card-2);border:0;border-bottom:2px solid var(--line-2);border-radius:4px;padding:2px 6px;font-size:15px;font-weight:700;width:120px}
.blank{background:var(--card-2);border:1px dashed var(--line-2);border-radius:8px;padding:3px 8px;font-weight:700;min-width:70px}
.blank.filled{border-style:solid;background:var(--sage-soft);color:var(--sage);border-color:transparent}
.blank.active{outline:2px solid var(--brass)}
.wordbank{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.wordchip{background:var(--card);border:1px solid var(--line-2);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.wordchip.used{opacity:.35}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;font-size:14px;line-height:1.5;font-weight:500}
.opt .box{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line-2);flex:none;display:grid;place-items:center;font-size:12px;font-weight:800;margin-top:1px}
.opt.on{border-color:var(--sage);background:var(--sage-soft)}
.opt.on .box{background:var(--sage);color:#fff;border-color:var(--sage)}
.ordrow{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.ordtext{flex:1;font-size:14px;line-height:1.5}
.ordbtns{display:flex;flex-direction:column;gap:4px}
.ordbtns .icon-btn{width:30px;height:26px;border-radius:8px}
.hiw{line-height:2.2}
.hw{background:none;border:0;padding:2px 3px;border-radius:6px;font-size:15px;font-weight:500;color:inherit}
.hw.on{background:var(--clay);color:#fff;font-weight:700}
.wc{margin-top:8px;font-size:12px;font-weight:700;color:var(--ink-3)}
.selfcard,.scorecard{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.scorecard{text-align:center}
.scorecard .big{font-size:34px;font-weight:800;font-family:Fraunces,Georgia,serif}
.scorecard.good{border-color:color-mix(in srgb,var(--sage) 40%,transparent);background:var(--sage-soft)}
.scorecard.mid{border-color:color-mix(in srgb,var(--brass) 40%,transparent);background:var(--brass-soft)}
.scorecard.bad{border-color:color-mix(in srgb,var(--clay) 40%,transparent);background:var(--clay-soft)}
.rate{display:flex;gap:8px;margin:12px 0 8px}
.ratebtn{flex:1;border:1px solid var(--line-2);background:var(--card-2);border-radius:12px;padding:12px 0;font-weight:800;font-size:16px}
.ratebtn:active{background:var(--sage);color:#fff;border-color:var(--sage)}

.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 10px);width:calc(100% - 20px);max-width:620px;
  background:color-mix(in srgb,var(--card) 90%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);display:flex;padding:6px;z-index:20}
.tabbar button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;color:var(--ink-3);font-size:10px;font-weight:700}
.tabbar button .ic3d{filter:saturate(.25) opacity(.6);transition:filter .2s,transform .2s}
.tabbar button.on{background:var(--card-2);color:var(--ink)}
.tabbar button.on .ic3d{filter:none;transform:translateY(-1px) scale(1.06)}
.ic3d{display:inline-block;flex:none;filter:drop-shadow(0 3px 5px rgba(40,32,20,.22))}
.ic3d svg{display:block;width:100%;height:100%}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-90px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:13px;z-index:50;transition:transform .3s;box-shadow:var(--shadow-lg);max-width:90vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.fade-in{animation:f .25s ease}
@keyframes f{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
/* 3D-style icons, shared by the app */
const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gSage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fdcbe"/><stop offset="1" stop-color="#2f8e75"/></linearGradient>
<linearGradient id="gBrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d68a"/><stop offset="1" stop-color="#b9862a"/></linearGradient>
<linearGradient id="gSlate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a9c6e8"/><stop offset="1" stop-color="#3c5f8c"/></linearGradient>
<linearGradient id="gClay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a98f"/><stop offset="1" stop-color="#a85338"/></linearGradient>
<linearGradient id="gPlum" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cba6dd"/><stop offset="1" stop-color="#6d4a86"/></linearGradient>
<linearGradient id="gBone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f3e8"/><stop offset="1" stop-color="#cdc5b4"/></linearGradient>
<radialGradient id="gShine" cx=".35" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs></svg>`;
const ICONS = {
  sun:`<path d="M6 34h36" stroke="url(#gBrass)" stroke-width="3" stroke-linecap="round"/><path d="M24 12a14 14 0 0 1 14 14v8H10v-8a14 14 0 0 1 14-14z" fill="url(#gBrass)"/><path d="M24 4v5M8 15l3.5 3.5M40 15l-3.5 3.5" stroke="url(#gSage)" stroke-width="3" stroke-linecap="round"/><ellipse cx="19" cy="20" rx="7" ry="3" fill="url(#gShine)"/>`,
  book:`<path d="M8 8h13a5 5 0 0 1 5 5v27a5 5 0 0 0-5-4H8z" fill="url(#gPlum)"/><path d="M40 8H27a5 5 0 0 0-5 5v27a5 5 0 0 1 5-4h13z" fill="url(#gBone)"/><path d="M28 18h9M28 24h9M28 30h6" stroke="#b6ac99" stroke-width="2" stroke-linecap="round"/><ellipse cx="15" cy="14" rx="6" ry="2.5" fill="url(#gShine)"/>`,
  clock:`<circle cx="24" cy="25" r="18" fill="url(#gBone)"/><circle cx="24" cy="25" r="18" fill="none" stroke="url(#gSlate)" stroke-width="3"/><path d="M24 14v11l7 5" stroke="#41556e" stroke-width="3" fill="none" stroke-linecap="round"/><ellipse cx="17" cy="15" rx="7" ry="3" fill="url(#gShine)"/>`,
  chart:`<rect x="7" y="26" width="8" height="16" rx="2.5" fill="url(#gSage)"/><rect x="20" y="16" width="8" height="26" rx="2.5" fill="url(#gBrass)"/><rect x="33" y="8" width="8" height="34" rx="2.5" fill="url(#gSlate)"/><ellipse cx="24" cy="18" rx="3" ry="1.3" fill="url(#gShine)"/>`,
  target:`<circle cx="24" cy="25" r="17" fill="url(#gClay)"/><circle cx="24" cy="25" r="11.5" fill="url(#gBone)"/><circle cx="24" cy="25" r="6" fill="url(#gClay)"/><circle cx="24" cy="25" r="2.4" fill="url(#gBone)"/><ellipse cx="17" cy="15" rx="7" ry="3" fill="url(#gShine)"/>`,
  mic:`<rect x="18" y="5" width="12" height="22" rx="6" fill="url(#gClay)"/><path d="M13 23a11 11 0 0 0 22 0" stroke="url(#gSlate)" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M24 34v7M18 43h12" stroke="url(#gSlate)" stroke-width="3" stroke-linecap="round"/><ellipse cx="22" cy="10" rx="3.5" ry="2" fill="url(#gShine)"/>`,
  ear:`<path d="M16 42c0-6-4-8-4-17a12 12 0 0 1 24 0c0 6-6 7-6 12a4 4 0 0 1-8 0c0-4 4-5 4-9a4 4 0 0 0-8 0" fill="url(#gBone)" stroke="url(#gSlate)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="19" cy="15" rx="5" ry="2.5" fill="url(#gShine)"/>`,
  gear:`<g transform="translate(24 24)"><g fill="url(#gSlate)">${Array.from({length:8},(_,i)=>`<rect x="-4" y="-21" width="8" height="10" rx="2.5" transform="rotate(${i*45})"/>`).join("")}</g><circle r="15" fill="url(#gSlate)"/><circle r="6.5" fill="url(#gBone)"/><ellipse cx="-5" cy="-8" rx="7" ry="3" fill="url(#gShine)"/></g>`
};
const ic = (n, s=26) => `<span class="ic3d" style="width:${s}px;height:${s}px"><svg viewBox="0 0 48 48" aria-hidden="true">${ICONS[n]||""}</svg></span>`;
</script>
<script src="bank-speaking.js"></script>
<script src="bank-writing-reading.js"></script>
<script src="bank-listening.js"></script>
<script src="app.js"></script>
</body>
</html>
